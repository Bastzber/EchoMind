name: Validate

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: soundbot-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary=av -r backend/requirements.txt
          python -m pip install -r backend/requirements-build.txt
          npm ci --ignore-scripts --progress=false
          python -m pip check

      - name: Verify repository hygiene
        run: python tests/build/verify_repository_hygiene.py

      - name: Run Python contracts
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' -v > python-contracts.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 60 python-contracts.log
            # Actions 的运行日志要登录才能下载；失败用例名挂到注解上，公开可读
            grep -E '^(FAIL|ERROR): ' python-contracts.log | head -n 10 | while IFS= read -r line; do
              echo "::error title=failed test::${line:0:400}"
            done
          fi
          exit "$status"

      - name: Run Electron and renderer contracts
        run: |
          node --check main.js
          node --check preload.js
          node --check assets/i18n.js
          node tests/frontend/check_renderer_contract.js

      - name: Verify repository diff hygiene
        run: git diff --check
