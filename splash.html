<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回声</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --bg-elev: #141414;
      --line: #242424;
      --tx: #e8e8e8;
      --tx2: #8a8a8a;
      --accent: #6b8afd;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body {
      width: 400px; height: 240px; overflow: hidden;
      display: flex; align-items: stretch; justify-content: stretch;
      color: var(--tx); user-select: none;
      -webkit-app-region: drag;
    }

    .card {
      position: relative; flex: 1; margin: 0;
      padding: 30px 28px 24px;
      background:
        radial-gradient(120% 90% at 50% -20%, rgba(107,138,253,.10), transparent 60%),
        var(--bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }

    /* 品牌图标：直接用应用图标（512px 源，缩到 56px 显示） */
    .mark {
      width: 56px; height: 56px; border-radius: 14px;
      display: block; object-fit: contain;
      /* 图标本身带深色底和圆角，这里不再加边框，避免双层圆角 */
      background: transparent;
    }

    .brand { margin-top: 14px; font-size: 19px; font-weight: 600; letter-spacing: .01em; }
    .status { margin-top: 6px; font-size: 13px; color: var(--tx); }
    .progress { margin-top: 4px; font-size: 11px; color: var(--tx2); min-height: 15px; }

    .track {
      position: relative; width: 148px; height: 2px; margin-top: auto;
      background: #1f1f1f; border-radius: 999px; overflow: hidden;
    }
    .track::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 38%;
      background: linear-gradient(90deg, rgba(107,138,253,0), var(--accent), rgba(107,138,253,0));
      border-radius: inherit; animation: sweep 1.25s ease-in-out infinite;
    }
    body.error .track::after { width: 100%; background: #ef4444; animation: none; }

    .foot { margin-top: 12px; font-size: 10px; color: #5c5c5c; letter-spacing: .04em; }

    .actions {
      display: none; margin-top: 14px; gap: 8px; justify-content: center;
      -webkit-app-region: no-drag;
    }
    body.error .actions { display: flex; }
    body.error .foot { display: none; }
    .action-button {
      padding: 6px 14px; color: var(--tx); background: transparent;
      border: 1px solid var(--line); border-radius: 7px;
      font: inherit; font-size: 12px; text-decoration: none; cursor: pointer;
    }
    .action-button:hover { background: rgba(255,255,255,.06); }

    @keyframes sweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(360%); }
    }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <img class="mark" src="assets/audio-icon.png" alt="回声" draggable="false">
    <div class="brand">回声 · AI 音效管理器</div>
    <div class="status" id="status">正在启动服务…</div>
    <div class="progress" id="progress">初始化中</div>
    <div class="track" aria-hidden="true"></div>
    <div class="foot">本地索引 · 听感检索 · 声音克隆</div>
    <div class="actions">
      <a class="action-button" href="soundbot-action://open-logs">打开日志</a>
      <button class="action-button" id="closeButton" type="button">退出应用</button>
    </div>
  </main>
  <script>
    window.setSoundBotSplashStatus = ({ status, progress, isError }) => {
      document.getElementById('status').textContent = status;
      document.getElementById('progress').textContent = progress;
      document.body.classList.toggle('error', Boolean(isError));
    };
    document.getElementById('closeButton').addEventListener('click', () => window.close());
  </script>
</body>
</html>
