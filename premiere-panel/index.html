<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>EchoMind 音效搜索</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">EchoMind</div>
    <div class="status" id="status">连接中…</div>
  </header>

  <section class="search">
    <textarea id="query" rows="2" placeholder="用一句话描述你要的声音，例如：低沉的猪哼，短一点"></textarea>
    <div class="row">
      <button id="go" class="primary">搜索</button>
      <button id="clear" class="ghost">清空</button>
      <div class="modes" id="modes">
        <button class="mode active" data-mode="term" title="字面命中：快，按文件名/描述/标签里的词匹配">精确</button>
        <button class="mode" data-mode="semantic" title="和软件里那套一致的向量语义搜索：更懂「意思」，但第一次可能要 10~30 秒">语义</button>
      </div>
      <label class="project"><span>工程</span><select id="project"></select></label>
    </div>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast"></div>
  </section>

  <section class="results" id="results">
    <div class="empty" id="empty">EchoMind 在后台运行时就能搜。输入一句话，回车即可。</div>
  </section>

  <footer class="foot">
    <audio id="player" controls preload="none"></audio>
  </footer>

  <script src="panel.js"></script>
</body>
</html>
